name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint web
        run: npx eslint "apps/web/**/*.{ts,tsx,js,jsx}"

  frontend-test:
    name: Frontend test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test web
        run: npm test -w cadence-web

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint api
        run: npx eslint "apps/api/**/*.{ts,tsx,js,jsx}" --ignore-pattern "apps/api/src/generated/**"

  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cadence
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/cadence
      JWT_SECRET: ci-test-jwt-secret-cadence-16
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w cadence-api

      - name: Migrate database
        run: npm exec -w cadence-api -- prisma migrate deploy

      - name: Seed database
        run: npm run prisma:seed -w cadence-api

      - name: Test api
        run: npm test -w cadence-api
